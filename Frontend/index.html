<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UPH Clínica Médica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <!-- ================= PANTALLA DE LOGIN ================= -->
  <section id="pantalla-login" class="pantalla-login">
    <div class="login-marca">
      <img src="logo-uph.png" alt="UPH" class="login-marca-logo" />
      <h1 class="login-marca-titulo">UPH Clínica Médica</h1>
    </div>

    <div class="panel-acceso">

      <!-- ---- LOGIN ---- -->
      <form id="form-login" class="ficha-login" autocomplete="off">
        <h2>Iniciar sesión</h2>

        <label for="in-user">Usuario</label>
        <input id="in-user" name="user" type="text" required minlength="5" maxlength="15" autofocus />

        <label for="in-pass">Contraseña</label>
        <input id="in-pass" name="password" type="password" required minlength="6" maxlength="20" />

        <button type="submit" class="btn btn-primario btn-full">
          <span class="btn-texto">Ingresar</span>
        </button>

        <p id="login-error" class="aviso aviso-error" hidden></p>

        <div class="login-alt-acciones">
          <a href="#" id="link-crear-usuario">¿No tienes cuenta? Crear usuario</a>
        </div>
      </form>

      <!-- ---- CREAR USUARIO (Tabs para doctor/paciente) ---- -->
      <div id="panel-crear-usuario" class="ficha-login oculto" autocomplete="off">
        <h2>Crear usuario</h2>
        
        <div class="sub-tabs">
          <button type="button" class="sub-tab activo" data-tipo-usuario="paciente">Paciente</button>
          <button type="button" class="sub-tab" data-tipo-usuario="doctor">Doctor</button>
        </div>

        <!-- FORM PACIENTE -->
        <form id="form-crear-paciente" class="forma-usuario-activa" autocomplete="off">
          <label for="cl-nombre">Nombre completo</label>
          <input id="cl-nombre" required minlength="3" />

          <label for="cl-identidad">Identidad</label>
          <input id="cl-identidad" required minlength="5" />

          <label for="cl-telefono">Teléfono</label>
          <input id="cl-telefono" required minlength="8" />

          <label for="cl-correo">Correo</label>
          <input id="cl-correo" type="email" required />

          <label for="cl-edad">Edad</label>
          <input id="cl-edad" type="number" min="0" max="120" required />

          <label for="cl-user">Usuario</label>
          <input id="cl-user" required minlength="4" pattern="^[a-zA-Z0-9_-]+$" />

          <label for="cl-password">Contraseña</label>
          <input id="cl-password" type="password" required minlength="6" />

          <button type="submit" class="btn btn-primario btn-full">Crear cuenta de paciente</button>
          <p id="crear-paciente-error" class="aviso aviso-error" hidden></p>
        </form>

        <!-- FORM DOCTOR -->
        <form id="form-crear-doctor" class="forma-usuario-oculta oculto" autocomplete="off">
          <label for="d-nombre">Nombre completo</label>
          <input id="d-nombre" required minlength="3" />

          <label for="d-colegiacion">No. de colegiación</label>
          <input id="d-colegiacion" required minlength="3" />

          <label for="d-especialidad">Especialidad</label>
          <input id="d-especialidad" required minlength="3" />

          <label for="d-telefono">Teléfono</label>
          <input id="d-telefono" required minlength="8" />

          <label for="d-correo">Correo</label>
          <input id="d-correo" type="email" required />

          <label for="d-user">Usuario</label>
          <input id="d-user" required minlength="4" pattern="^[a-zA-Z0-9_-]+$" />

          <label for="d-password">Contraseña</label>
          <input id="d-password" type="password" required minlength="6" />

          <button type="submit" class="btn btn-primario btn-full">Crear cuenta de doctor</button>
          <p id="crear-doctor-error" class="aviso aviso-error" hidden></p>
        </form>

        <div class="login-alt-acciones">
          <a href="#" data-volver-login>Volver a iniciar sesión</a>
        </div>
      </div>

    </div>

    <button id="btn-tema-login" class="btn-tema" type="button" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">
      <span class="icono-tema"></span>
    </button>
  </section>

  <!-- ================= APP (oculta hasta autenticarse) ================= -->
  <div id="app" class="app oculto">

    <aside class="barra-lateral">
      <div class="barra-marca">
        <img src="logo-uph.png" alt="UPH" class="barra-marca-logo" />
        <h1>UPH Clínica Médica</h1>
      </div>

      <nav class="barra-nav" id="barra-nav">
        <button class="nav-item" data-vista="inicio">
          <span class="nav-num">00</span> Panorama
        </button>
        <button class="nav-item" data-vista="citas">
          <span class="nav-num">01</span> Citas
        </button>
        <button class="nav-item" data-vista="consultas">
          <span class="nav-num">02</span> Consultas
        </button>
        <button class="nav-item" data-vista="recetas" data-solo-doctor="1">
          <span class="nav-num">03</span> Recetas
        </button>
        <button class="nav-item" data-vista="pacientes" data-solo-doctor="1">
          <span class="nav-num">04</span> Pacientes
        </button>
        <button class="nav-item" data-vista="doctores">
          <span class="nav-num">05</span> Doctores
        </button>
        <button class="nav-item" data-vista="medicamentos" data-solo-doctor="1">
          <span class="nav-num">06</span> Medicamentos
        </button>
      </nav>

      <div class="barra-pie">
        <button id="btn-tema-app" class="btn-tema" type="button" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">
          <span class="icono-tema"></span>
        </button>
        <div class="barra-sesion">
          <span id="sesion-user" class="barra-sesion-user">—</span>
          <span id="sesion-rol" class="etiqueta-rol">—</span>
        </div>
        <button id="btn-salir" class="btn btn-fantasma btn-full">Cerrar sesión</button>
      </div>
    </aside>

    <main class="contenido">
      <header class="contenido-encabezado">
        <h2 id="vista-titulo">Panorama</h2>
        <div id="toast" class="toast" hidden></div>
      </header>

      <div id="vista-cuerpo" class="vista-cuerpo">
        <!-- Contenido dinámico inyectado por app.js -->
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
