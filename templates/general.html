<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestion</title>
</head>
<body>
    
    <div id="header">
        <h1>Sistema de Gestion Educativa</h1>
        <p>Bienvenido: <span id="nombreUsuario"></span> | Rol: <span id="rolUsuario"></span></p>
        <button onclick="cerrarSesion()">Cerrar Sesion</button>
    </div>

    <div id="modulos">
        
        <div id="modulo-estudiantes" style="display:none;">
            <h2>Modulo de Estudiantes</h2>
            
            <div id="formulario-estudiante" style="display:none;">
                <h3>Agregar Estudiante</h3>
                <form id="form-crear-estudiante">
                    <input type="text" id="nombre" placeholder="Nombre" required>
                    <input type="text" id="telefono" placeholder="Telefono" required>
                    <input type="email" id="correo" placeholder="Correo" required>
                    <button type="submit">Agregar Estudiante</button>
                </form>
            </div>

            <h3>Lista de Estudiantes</h3>
            <table id="tabla-estudiantes" border="1">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Telefono</th>
                        <th>Correo</th>
                        <th id="col-acciones" style="display:none;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody-estudiantes">
                </tbody>
            </table>
        </div>

        <div id="modulo-asignaturas" style="display:none;">
            <h2>Modulo de Asignaturas</h2>
            
            <div id="formulario-asignatura">
                <h3>Agregar Asignatura</h3>
                <form id="form-crear-asignatura">
                    <input type="text" id="nom-asignatura" placeholder="Nombre" required>
                    <input type="number" id="creditos" placeholder="Creditos" required>
                    <input type="text" id="seccion" placeholder="Seccion" required>
                    <input type="text" id="dia" placeholder="Dia" required>
                    <input type="text" id="horario" placeholder="Horario" required>
                    <button type="submit">Agregar Asignatura</button>
                </form>
            </div>

            <h3>Lista de Asignaturas</h3>
            <table id="tabla-asignaturas" border="1">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Creditos</th>
                        <th>Seccion</th>
                        <th>Dia</th>
                        <th>Horario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody-asignaturas">
                </tbody>
            </table>
        </div>

    </div>

    <script src="/static/general.js"></script>
</body>
</html>
