name: Validar y desplegar Node.js en paralelo

on:
  push:
    branches: ["main"]

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar backend paralelo en VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            if [ ! -d /app/uph-clinica-node/.git ]; then
              git clone --branch nodejs https://github.com/kevinhndz/MedicalC.git /app/uph-clinica-node
            else
              git -C /app/uph-clinica-node pull --ff-only origin nodejs
            fi
            cp /app/uph-clinica/.env /app/uph-clinica-node/.env
            cp /app/uph-clinica/base.db /app/uph-clinica-node/base.db
            docker compose -f /app/uph-clinica-node/docker-compose.node.yml up -d --build
            healthy=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8002/health; then
                healthy=true
                echo
                break
              fi
              sleep 2
            done
            if [ "$healthy" != "true" ]; then
              docker compose -f /app/uph-clinica-node/docker-compose.node.yml logs --tail=100
              exit 1
            fi
            echo "Node.js desplegado en paralelo; FastAPI permanece en 8000."
